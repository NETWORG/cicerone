name: Redirect GitHub Pages to cicerallye.com

# The site now deploys to Azure Static Web Apps (see deploy.yml), but the
# old GitHub Pages URL (networg.github.io/cicerone) is still bookmarked/
# linked in places. Instead of letting it 404 or serve stale content, keep
# publishing a tiny redirect stub there that forwards visitors to the new
# domain.

on:
  push:
    branches:
      - main
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/pages-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
